org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# ── 시선 빌드 설정 ─────────────────────────────────────────────────
# API 기본 주소. 에뮬레이터·USB 실기기 모두 `adb reverse tcp:8000 tcp:8000` 으로 PC의 로컬 백엔드에 붙는다
# (데모 APK #1, docs/demo/데모APK1_설치안내.md). adb reverse 없이 에뮬레이터만 쓸 때는 http://10.0.2.2:8000/api/v1/
# 데모·운영 서버는 -Pseesun.apiBaseUrl=https://.../api/v1/ 로 덮어쓴다.
seesun.apiBaseUrl=http://127.0.0.1:8000/api/v1/
# Firebase 전화번호 인증 사용 여부. Firebase 프로젝트와 google-services.json이
# 준비되기 전에는 false로 둔다(android/README.md "Firebase 전환" 참고).
seesun.firebase.enabled=false
# 서버 없이 메모리 가짜 저장소(식사·음식·로그인)를 쓸지. 백엔드가 준비되기 전 화면 개발용.
seesun.fakeData=false
