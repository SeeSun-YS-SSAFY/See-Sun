components:
  schemas:
    AbnormalEndReasonEnum:
      enum:
      - NORMAL
      - APP_KILLED
      - CRASH
      - UNKNOWN
      type: string
      description: |-
        * `NORMAL` - 정상 종료
        * `APP_KILLED` - 앱 종료됨
        * `CRASH` - 충돌
        * `UNKNOWN` - 알 수 없음
    Allergen:
      type: object
      properties:
        code:
          type: string
          title: 코드
          maxLength: 30
        name_ko:
          type: string
          title: 이름
          maxLength: 50
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: 표시 순서
      required:
      - code
      - display_order
      - name_ko
    AmountRequest:
      type: object
      properties:
        ratio:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          description: 1회 제공량 배수(한 그릇=1, 반=0.5, 두=2, 많이=1.5)
        grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        text:
          type: string
          description: '예: 반 그릇'
          maxLength: 50
    AppSettings:
      type: object
      properties:
        voice_guide:
          type: boolean
        voice_speed:
          $ref: '#/components/schemas/VoiceSpeedEnum'
        hw_button_voice:
          type: boolean
    AppSettingsRequest:
      type: object
      properties:
        voice_guide:
          type: boolean
        voice_speed:
          $ref: '#/components/schemas/VoiceSpeedEnum'
        hw_button_voice:
          type: boolean
    BlankEnum:
      enum:
      - ''
    BulkResult:
      type: object
      properties:
        client_uuid:
          type: string
          nullable: true
        status:
          type: string
          description: created|duplicate|invalid
        id:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties: {}
      required:
      - client_uuid
      - status
    ConsentDecisionListRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDecisionRequest'
      required:
      - items
    ConsentDecisionRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ConsentTypeEnum'
        version:
          type: string
          minLength: 1
          maxLength: 32
        agreed:
          type: boolean
        method:
          $ref: '#/components/schemas/MethodEnum'
        app_version:
          type: string
          description: 앱 버전(입증용)
          maxLength: 32
        screen_id:
          type: string
          description: 동의를 받은 화면 ID(입증용)
          maxLength: 40
        voice_confirmed:
          type: boolean
          nullable: true
          description: 음성 동의 재확인 통과 여부
      required:
      - agreed
      - method
      - type
      - version
    ConsentDocument:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/ConsentTypeEnum'
          title: 동의 항목
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          title: 종류
        version:
          type: string
          title: 버전
          maxLength: 32
        title:
          type: string
          title: 제목
          maxLength: 200
        required:
          type: boolean
          title: 필수 여부
        url:
          type: string
          format: uri
          title: 전문 주소
          maxLength: 200
        summary:
          type: string
          title: 낭독용 요약
        effective_at:
          type: string
          format: date
          title: 시행일
      required:
      - effective_at
      - title
      - type
      - version
    ConsentStatus:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatusItem'
        all_required_agreed:
          type: boolean
        deleted:
          type: array
          items:
            type: string
          description: 철회로 삭제한 데이터 종류(health_profile, diet_scores)
      required:
      - all_required_agreed
      - items
    ConsentStatusItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ConsentTypeEnum'
        kind:
          $ref: '#/components/schemas/KindEnum'
        title:
          type: string
        required:
          type: boolean
        current_version:
          type: string
        agreed:
          type: boolean
        agreed_version:
          type: string
          nullable: true
        agreed_at:
          type: string
          format: date-time
          nullable: true
        method:
          type: string
          nullable: true
        needs_reconsent:
          type: boolean
      required:
      - agreed
      - agreed_at
      - agreed_version
      - current_version
      - kind
      - method
      - needs_reconsent
      - required
      - title
      - type
    ConsentTypeEnum:
      enum:
      - TOS
      - PRIVACY
      - OVERSEAS
      - SENSITIVE
      - MARKETING
      type: string
      description: |-
        * `TOS` - 이용약관
        * `PRIVACY` - 개인정보 수집·이용
        * `OVERSEAS` - 국외이전 고지
        * `SENSITIVE` - 건강정보(민감정보) 처리
        * `MARKETING` - 광고성 정보 수신
    DailyReport:
      type: object
