openapi: 3.0.3
info:
  title: See:Sun API
  version: 2.0.0
  description: 시각장애인·저시력인을 위한 웰니스 앱 See:Sun(시선) 백엔드 API. 2차(식단·온보딩) 기준.
paths:
  /api/v1/allergens/:
    get:
      operationId: allergens_list
      description: 알레르기 마스터 19종(지정 순서)
      summary: 알레르기 목록
      tags:
      - Health
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Allergen'
          description: ''
  /api/v1/auth/firebase/:
    post:
      operationId: auth_firebase_create
      description: '오류: 400 VALIDATION_ERROR/BIRTHDATE_REQUIRED/PHONE_REQUIRED · 401
        INVALID_ID_TOKEN · 403 AGE_RESTRICTED/ACCOUNT_DISABLED · 503 AUTH_NOT_CONFIGURED'
      summary: Firebase 전화번호 인증 → 앱 JWT
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FirebaseExchangeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirebaseExchangeResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Refresh Token을 블랙리스트에 등록하여 로그아웃합니다.
      summary: 로그아웃
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tts_message:
                    type: string
              examples:
                Success:
                  value:
                    message: 로그아웃이 완료되었습니다.
                    tts_message: 로그아웃이 완료되었습니다. 다시 로그인해주세요.
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  tts_message:
                    type: string
              examples:
                InvalidToken:
                  value:
                    error: INVALID_TOKEN
                    tts_message: 유효하지 않은 토큰입니다.
                  summary: Invalid Token
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: POST /auth/token/refresh/ — 앱은 7일 회전 refresh로 오래 로그인 상태를 유지하므로
        갱신 때도 last_login을 남긴다
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/consents/documents/:
    get:
      operationId: consents_documents_list
      description: 현재 동의 문서 목록(가입 전 화면에서 읽으므로 인증 불필요)
      summary: 동의 문서 목록
      tags:
      - Consents
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentDocument'
          description: ''
  /api/v1/diet/evaluate/:
    post:
      operationId: diet_evaluate_create
      description: '확인 화면용 평가(저장 안 함): 섭취량 환산·당류·탄수화물 지표·알레르기·경고'
      summary: 식사 평가(경고·지표)
      tags:
      - Meals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
          description: ''
  /api/v1/diet/score/:
    get:
      operationId: diet_score_retrieve
      summary: 오늘의 식단 점수(일별 리포트)
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, 기본 오늘
      tags:
      - Diet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
          description: ''
  /api/v1/diet/stats/:
    get:
      operationId: diet_stats_retrieve
      summary: 주간·월간 리포트
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD (주간은 그 주 월요일로 맞춤)
      - in: query
        name: period
        schema:
          type: string
          enum:
          - month
          - week
      tags:
      - Diet
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: ''
  /api/v1/exercise-sessions/bulk/:
    post:
      operationId: exercise_sessions_bulk_create
      description: sessions[] = {client_uuid, exercise_name|playlist_id, mode, started_at,
        ended_at, status, items[]}. 10초 미만이거나 완료되지 않은 세션은 is_valid=false로 저장합니다.
      summary: 운동 세션 일괄 업로드(멱등)
      tags:
      - Exercise
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBulkRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionBulkRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionBulkRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBulkResponse'
          description: ''
  /api/v1/exercise/weekly/:
    get:
      operationId: exercise_weekly_retrieve
      summary: 주간 운동 리포트
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD(그 주 월요일로 맞춤), 기본 이번 주
      tags:
      - Exercise
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyExercise'
          description: ''
  /api/v1/exercises/{exercise_id}/:
    get:
      operationId: exercises_retrieve
      description: 운동 ID를 받아 상세 정보를 반환합니다.
      summary: 운동 상세 정보 조회
      parameters:
      - in: path
        name: exercise_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDetail'
          description: ''
        '404':
          description: Exercise not found
  /api/v1/exercises/{exercise_id}/audio/:
    get:
      operationId: exercises_audio_retrieve
      description: |-
        단일 운동의 병합된 오디오 파일 반환 API

        - 병합된 파일이 있으면 반환
        - 없으면 실시간 병합 후 반환
      summary: 운동 안내 병합 음성(1차)
      parameters:
      - in: path
        name: exercise_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/exercises/category/:
    get:
      operationId: exercises_category_retrieve
      description: 모든 운동 카테고리 목록을 반환합니다.
      summary: 운동 카테고리 목록 조회
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseCategory'
              examples:
                Success:
                  value:
                  - - category_id: '1'
                      display_name: 근력 운동
                    - category_id: '2'
                      display_name: 유산소 운동
          description: ''
  /api/v1/exercises/category/{category_id}/:
    get:
      operationId: exercises_category_exercises
      description: 특정 카테고리 ID를 받아 해당 카테고리 정보와 운동 목록(픽토그램 포함)을 반환합니다.
      summary: 카테고리별 운동 목록 조회
      parameters:
      - in: path
        name: category_id
        schema:
          type: string
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Success
        '404':
          description: Category not found
  /api/v1/exercises/frequent/:
    get:
      operationId: exercises_frequent_retrieve
      description: |-
        자주 하는 운동 목록 API (SETUP_002)
        본인의 완료된 유효 세션(10초 이상)을 운동 이름 기준으로 집계해 많이 한 순서로 반환
      summary: 자주 하는 운동 목록
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequentExerciseList'
          description: ''
  /api/v1/exercises/google-tts/:
    post:
      operationId: exercises_google_tts_create
      description: Google Cloud TTS를 이용하여 텍스트를 오디오로 변환하여 반환하는 API
      summary: 텍스트 음성 변환(1차)
      tags:
      - Exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSTextRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TTSTextRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TTSTextRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/exercises/playlist/:
    get:
      operationId: exercises_playlist_list
      description: 사용자가 생성한 모든 활성 플레이리스트 목록을 반환합니다.
      summary: 내 플레이리스트 목록 조회
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'
          description: ''
  /api/v1/exercises/playlist/{playlist_id}/:
    get:
      operationId: exercises_playlist_retrieve
      description: 플레이리스트 ID를 받아 상세 정보(운동 목록 포함)를 반환합니다. 본인의 플레이리스트만 조회 가능합니다.
      summary: 플레이리스트 상세 조회
      parameters:
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
          description: ''
        '404':
          description: Playlist not found or permission denied
    patch:
      operationId: exercises_playlist_partial_update
      description: 플레이리스트의 제목 등을 수정합니다. (운동 목록 수정 아님)
      summary: 플레이리스트 기본 정보 수정
      parameters:
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
          description: ''
        '404':
          description: Playlist not found
    delete:
      operationId: exercises_playlist_destroy
      description: 플레이리스트를 삭제합니다.
      summary: 플레이리스트 삭제
      parameters:
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Playlist deleted
        '404':
          description: Playlist not found
  /api/v1/exercises/playlist/{playlist_id}/audio/:
    get:
      operationId: exercises_playlist_audio_retrieve
      description: |-
        루틴 화면 진입 시 동적 TTS 오디오 생성 API

        - 운동 목록이 없으면: "{루틴이름} 화면입니다. 운동추가 버튼을 눌러 추가해주세요."
        - 운동 목록이 있으면: "{루틴이름} 화면입니다. 아래에 목록 중 운동을 선택해주세요."
      summary: 루틴 화면 안내 음성(1차)
      parameters:
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/exercises/playlist/{playlist_id}/items/:
    post:
      operationId: exercises_playlist_items_create
      description: 특정 플레이리스트에 운동을 추가합니다.
      summary: 플레이리스트에 운동 추가
      parameters:
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistItemAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaylistItemAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaylistItemAddRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
          description: ''
        '404':
          description: Playlist not found
  /api/v1/exercises/playlist/{playlist_id}/items/{item_id}/:
    patch:
      operationId: exercises_playlist_items_partial_update
      description: 운동 항목의 세트 수, 횟수, 순서 등을 수정합니다.
      summary: 플레이리스트 항목 상세 수정
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlaylistItemUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
          description: ''
        '404':
          description: Item not found
    delete:
      operationId: exercises_playlist_items_destroy
      description: 플레이리스트에서 특정 운동 항목을 삭제합니다.
      summary: 플레이리스트 항목 삭제
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: playlist_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Exercises
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
          description: ''
        '404':
          description: Item not found
  /api/v1/exercises/playlist/create/:
    post:
      operationId: exercises_playlist_create_create
      description: 제목과 운동 목록을 받아 새로운 루틴을 생성합니다.
      summary: 운동 루틴 생성
      tags:
      - Exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistCreate'
          description: ''
  /api/v1/favorites/foods/:
    get:
      operationId: favorites_foods_list
      summary: 선호 식단 목록
      tags:
      - Recommendations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodSummary'
          description: ''
  /api/v1/favorites/foods/{food_id}/:
    post:
      operationId: favorites_foods_create
      summary: 선호 식단 저장
      parameters:
      - in: path
        name: food_id
        schema:
          type: integer
        required: true
      tags:
      - Recommendations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodSummary'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodSummary'
          description: ''
    delete:
      operationId: favorites_foods_destroy
      summary: 선호 식단 삭제
      parameters:
      - in: path
        name: food_id
        schema:
          type: integer
        required: true
      tags:
      - Recommendations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/foods/{food_id}/:
    get:
      operationId: foods_retrieve
      summary: 음식 상세
      parameters:
      - in: path
        name: food_id
        schema:
          type: integer
        required: true
      tags:
      - Foods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDetail'
          description: ''
  /api/v1/foods/barcode/{code}/:
    get:
      operationId: foods_barcode_retrieve
      description: 바코드 연계 정보가 적재된 음식만 조회됩니다(식품안전나라 C005 연계는 후속). 없으면 404 → 영양성분표 촬영
        안내.
      summary: 바코드로 음식 조회
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - Foods
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDetail'
